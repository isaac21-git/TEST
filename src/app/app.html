<app-navbar
  [menuOpen]="menuOpen"
  (menuToggled)="menuOpen = $event"
></app-navbar>

<nav
  class="fixed inset-x-0 bottom-0 top-20 z-10 bg-zinc-950 p-8 text-white trans  ition-transform duration-300 ease-in-out motion-reduce:transition-none"
  [class.translate-x-0]="menuOpen"
  [class.-translate-x-full]="!menuOpen"
  [attr.aria-hidden]="!menuOpen"
  [attr.inert]="menuOpen ? null : ''"
>
  <h2 class="mb-6 text-xl font-bold">Menu</h2>
  <ul class="space-y-4">
    <li>
      <a
        href="#accueil"
        (click)="menuOpen = false"
        class="text-lg hover:text-indigo-400"
      >
        Accueil
      </a>
    </li>
    <li>
      <a
        href="#taches"
        (click)="menuOpen = false"
        class="text-lg hover:text-indigo-400"
      >
        Tâches
      </a>
    </li>
  </ul>
</nav>

<div
  id="accueil"
  class="min-h-screen bg-black p-6 text-white transition-opacity duration-300 motion-reduce:transition-none"
  [class.opacity-0]="menuOpen"
  [class.pointer-events-none]="menuOpen"
  [attr.aria-hidden]="menuOpen"
  [attr.inert]="menuOpen ? '' : null"
>
    <div class="mx-auto max-w-2xl rounded-2xl border border-zinc-800 p-6">
      <h1 class="mb-6 text-2xl font-bold">
        TaskFlow – Tableau de bord
      </h1>

      <div class="mb-8 grid grid-cols-1 sm:grid-cols-2 gap-4 ">
        <div class="rounded-xl bg-zinc-800 p-5 flex items-center justify-around gap-4">
          <p class="text-zinc-400">Total des tâches</p>
          <p class="mt-3 text-4xl font-bold">
            {{ totalTasks() }}
          </p>
        </div>

        <div class="rounded-xl bg-zinc-800 p-5 flex items-center justify-around gap-4">
          <p class="text-zinc-400">Terminées</p>
          <p class="mt-3 text-4xl font-bold text-green-500 ">
            {{ completedTasks() }}
          </p>
        </div>
      </div>

      <form
        class="mb-8 flex gap-2"
        (submit)="$event.preventDefault(); addTask(taskInput)"
      >
        <input
          #taskInput
          type="text"
          placeholder="Nouvelle tâche..."
          class="min-w-0 flex-1 rounded-lg border border-zinc-700 bg-zinc-900 px-4 py-3 outline-none focus:border-indigo-500"
        />

        <button
          type="submit"
          class="rounded-lg bg-indigo-600 px-5 py-3 font-semibold hover:bg-indigo-500"
        >
          Ajouter
        </button>
      </form>

      <h2 id="taches" class="mb-4 text-xl font-bold">Mes tâches</h2>
      <div class="space-y-3">
        @for (task of tasks(); track task.id) {
          <div class="flex items-center justify-between gap-3 rounded-lg bg-zinc-900 p-4">
            <div class="flex min-w-0 items-center gap-3">
              <input
                type="checkbox"
                [checked]="task.completed"
                (change)="toggleTask(task.id)"
                class="h-5 w-5 accent-green-500"
              />

              <span
                [class.line-through]="task.completed"
                [class.text-zinc-500]="task.completed"
              >
                {{ task.title }}
              </span>
            </div>

            <div class="flex items-center justify-around gap-3">
              <button
                (click)="renameTask(task.id)"
                class="shrink-0 text-red-500 hover:text-red-400"
              >
                Modifier
              </button>
              <button
                (click)="deleteTask(task.id)"
                class="shrink-0 text-red-500 hover:text-red-400"
              >
                Supprimer
              </button>
            </div>
          </div>
        } @empty {
          <p class="py-5 text-center text-zinc-500">
            Aucune tâche pour le moment.
          </p>
        }
      </div>
    </div>
</div>
